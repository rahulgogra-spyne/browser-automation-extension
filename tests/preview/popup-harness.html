<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Popup harness</title>
    <!--
      Renders the real popup outside Chrome's extension runtime with a stubbed
      chrome.* API and canned extraction results, for UI work. Serve the repo
      root over HTTP (e.g. `python -m http.server 5500`) and open
      /tests/preview/popup-harness.html
        ?mapping   a mapping in progress (progress panel)
        ?config    a CRM page read with its saved layout (with message history)
        ?fallback  a CRM page whose saved layout no longer fits
        ?multi     a table page (several records)
        ?empty     nothing found
        ?error     server unreachable
    -->
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      const f = (key, label, value, check = 'verified') => ({ key, label, value, check });

      const single = [
        {
          fields: [
            f('first_name', 'First name', 'John'), f('last_name', 'Last name', 'Doe'),
            f('email', 'Email', 'john.doe@example.com'),
            f('phone_mobile', 'Cell', '(214) 555-0147'), f('phone_work', 'Work', '(469) 555-0100', 'not_on_page'),
            f('address', 'Address', '123 Main Street'), f('city', 'City', 'Plano'), f('state', 'State', 'TX'),
            f('vehicle_year', 'Year', '2024'), f('vehicle_model', 'Model', 'Camry XSE'),
            f('vin', 'VIN', '1HGCM82643A004352', 'bad_format'), f('stock_number', 'Stock #', 'T24518'),
            f('preferred_contact_time', 'Preferred contact time', 'Weekday evenings after 6pm'),
            f('notes', 'Customer comments', 'Looking for a hybrid, prefers email contact. Wants to know about current financing offers and trade-in value.'),
          ],
        },
      ];
      const multi = [
        ['Jane', 'Roe', 'jane.roe@example.com', '(214) 555-0147', 'Cars.com', 'New'],
        ['Al', 'Smith', 'al.smith@example.com', '(972) 555-0199', 'Walk-in', 'Working'],
        ['Maria', 'Garcia', 'maria.g@example.com', '(469) 555-0123', 'Dealer Website', 'Appointment set'],
      ]?.map(([first, last, email, phone, source, status], i) => ({
        fields: [
          f('first_name', 'First', first), f('last_name', 'Last', last), f('email', 'Email', email),
          f('phone_mobile', 'Cell', phone, i === 1 ? 'not_on_page' : 'verified'),
          f('lead_source', 'Source', source), f('lead_status', 'Status', status),
        ],
      }));

      const history = {
        text_messages: [
          { timestamp: '09/21/2026 10:14 AM', direction: 'sms-bubble sms-inbound', sender: 'John Doe', body: 'Hi, is the Camry XSE on your site still available?' },
          { timestamp: '09/21/2026 10:20 AM', direction: 'sms-bubble sms-outbound', sender: 'Mike Ross', body: 'Hi John, yes it is! Want to come see it this week?' },
          { timestamp: '09/21/2026 10:31 AM', direction: 'sms-bubble sms-inbound', sender: 'John Doe', body: 'Saturday morning works. Can you send the out-the-door price?' },
        ],
        emails: [
          { timestamp: '09/21/2026 10:34 AM', direction: 'Outbound', sender: 'Mike Ross', subject: 'Your Camry XSE quote', body: 'Hi John, attached is the out-the-door price for the 2024 Camry XSE, stock T24518.' },
        ],
        notes: [{ timestamp: '09/21/2026', author: 'Mike Ross', body: 'Customer prefers email. Trading in a 2018 Honda Civic EX.' }],
      };
      const verified = (fields) => fields.map((x) => ({ ...x, check: 'verified' }));
      const crmRecord = [{ fields: verified(single[0].fields.slice(0, 10)), collections: history }];

      const extract = params.has('error')
        ? { ok: false, error: "Can't reach the extraction server at http://localhost:8787. Check it's running and the URL in Settings is right." }
        : params.has('config')
          ? { ok: true, mode: 'config', site: 'VinSolutions', configVersion: 3, recordId: '1001', pageType: 'Customer dashboard', records: crmRecord, lists: [{ id: 'lead_list', entity: 'lead' }], crmId: 'vinsolutions', saved: { date: '2026-10-01', count: 4, messages: 17, added: 1, updated: 0, messagesAdded: 5, filename: 'SpyneLeads/leads_2026-10-01.csv', messagesFilename: 'SpyneLeads/leads_messages_2026-10-01.csv' } }
          : params.has('fallback')
            ? {
                ok: true,
                mode: 'ai-fallback',
                site: 'VinSolutions',
                configVersion: 3,
                recordId: '1001',
                notice: "The saved VinSolutions layout didn't fit this page (no email or phone_mobile, Texting: tab not found). Re-mapping it now; AI read the page this time.",
                records: [{ fields: single[0].fields, collections: { notes: history.notes } }],
              }
            : {
                ok: true,
                mode: 'ai',
                pageType: params.has('multi') ? 'Leads table' : 'CRM lead record',
                site: 'VinSolutions',
                records: params.has('empty') ? [] : params.has('multi') ? multi : single,
                model: 'gpt-4.1-mini',
              };
      const responses = {
        status: { ok: true, date: '2026-09-30', count: 3, messages: 12, filename: 'SpyneLeads/leads_2026-09-30.csv', lastWriteError: null },
        extract,
        save: {
          ok: true, date: '2026-09-30', count: 4, messages: 17, added: 1, updated: 0, messagesAdded: 5,
          filename: 'SpyneLeads/leads_2026-09-30.csv', messagesFilename: 'SpyneLeads/leads_messages_2026-09-30.csv',
        },
      };
      window.sentMessages = [];
      // ?mapping shows a mapping in progress (the popup follows it from session storage)
      const startedAt = Date.now() - 95_000;
      const session = params.has('mapping')
        ? { mapping: { crmId: 'demo-1crmcloud-com', name: '1CRM demo', startedAt, status: 'running', stage: 'record', detail: 'Opening section "Activities" of the contact record', current: 2, total: 3, llmCalls: 3, avgLlmMs: 21000, plan: { records: 1, lists: 1 }, estimateMs: 210_000, log: ['Mapping 1CRM demo from this browser…', 'Exploring 1CRM demo from https://demo.1crmcloud.com/app/', '  explored https://demo.1crmcloud.com/app/?module=Contacts&action=index (lists: 20× ^/app/\?action=DetailView&module=Contacts&record=…)', '  people records: https://demo.1crmcloud.com/app/?action=DetailView&module=Contacts&record=40c174d8…', '  mapping contact record …', '    view "Main": 13 fields, lists [history]; sections [Activities,History (open)]'] } }
        : {};
      window.chrome = {
        storage: { session: { get: async (key) => (key in session ? { [key]: session[key] } : {}), set: async () => {} }, local: { get: async () => ({}), set: async () => {} } },
        runtime: {
          sendMessage: (msg) => {
            window.sentMessages.push(msg);
            return new Promise((resolve) => setTimeout(() => resolve(responses[msg.type]), 300));
          },
          openOptionsPage: () => {},
        },
        tabs: { query: async () => [{ id: 1, url: 'https://apps.vinsolutions.com/x', title: 'Lead' }] },
      };
    </script>
    <script type="module">
      const html = await (await fetch('../../extension/popup/popup.html')).text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = '../../extension/popup/popup.css';
      document.head.append(css);
      doc.querySelectorAll('script').forEach((s) => s.remove());
      document.body.append(...doc.body.childNodes);
      await import('../../extension/popup/popup.js');
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spyne Lead Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand">Lead Capture</span>
      <span>
        <button id="open-console" type="button" class="link-btn">Capture window</button>
        <button id="settings" type="button" class="link-btn">Settings</button>
      </span>
    </header>
    <div id="today" class="today">&nbsp;</div>
    <div id="banner" class="banner" hidden>
      <span id="banner-text"></span>
      <button id="retry" type="button">Write CSV again</button>
    </div>
    <main>
      <p id="status" class="status">Reading this page…</p>
      <p id="legend" class="legend" hidden>
        <span class="swatch not_on_page"></span> not found on the page, check it
        <span class="swatch bad_format"></span> unusual format
      </p>
      <div id="bulk" class="bulk" hidden>
        <label><input id="select-all" type="checkbox" checked /> Select all</label>
        <span id="selected-count"></span>
      </div>
      <div id="bulk-panel" class="bulk-panel" hidden>
        <p id="bulk-text" class="list-text"></p>
        <div class="row">
          <button id="bulk-cancel" type="button">Cancel</button>
          <button id="bulk-dismiss" type="button" hidden>Dismiss</button>
          <button id="bulk-window" type="button" class="link-btn">Capture window</button>
        </div>
      </div>
      <div id="map-offer" class="map-offer" hidden>
        <p id="map-text" class="list-text"></p>
      </div>
      <div id="map-progress" class="map-progress" hidden>
        <div class="map-head">
          <span id="map-title"></span>
          <span id="map-time" class="map-time"></span>
        </div>
        <div class="map-bar"><div id="map-bar-fill" class="map-bar-fill"></div></div>
        <ol id="map-stages" class="map-stages"></ol>
        <p id="map-detail" class="map-detail"></p>
        <details class="map-details"><summary>Details</summary><pre id="map-log" class="map-log"></pre></details>
      </div>
      <div id="list" class="list" hidden>
        <p id="list-text" class="list-text"></p>
        <ol id="list-items" class="list-items"></ol>
      </div>
      <div id="records"></div>
    </main>
    <footer class="actions">
      <button id="rescan" type="button" disabled>Re-scan</button>
      <button id="map-crm" type="button" hidden>Map this CRM</button>
      <button id="capture-crm" type="button" hidden>Capture whole CRM</button>
      <button id="crawl-all" type="button" title="Proof of concept: opens every page of this site (links, menus, tabs, cards, grid rows and their drawers) and saves everything each one shows to crawl_values_<date>.csv and crawl_pages_<date>.csv. No layout, no AI, no filter on the kind of data. Never presses anything that adds, edits, deletes, sends, exports or signs out.">Crawl everything (POC)</button>
      <button id="capture-all" type="button" class="primary" hidden>Capture all</button>
      <button id="save" type="button" class="primary" disabled>Save to CSV</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gather information</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="console.css" />
  </head>
  <body>
    <main class="console">
      <header class="console-head">
        <div>
          <h1>Gather information</h1>
          <p class="muted">Gathers the customers and vehicles of the CRM on screen and downloads them as CSV files when it finishes. You can close this popup: the capture keeps running.</p>
        </div>
      </header>

      <section id="site" class="card site-card">
        <div>
          <h2 id="site-name">No CRM on screen</h2>
          <p id="site-text" class="muted">Go to your CRM in this tab and sign in.</p>
        </div>
      </section>

      <section class="card start-card">
        <div class="row start-row">
          <button id="gather" type="button" class="primary" disabled>Gather information</button>
        </div>
      </section>

      <section id="now" class="card" hidden>
        <h2 id="now-title"></h2>
        <p id="now-phase" class="phase"></p>
        <div class="row">
          <button id="cancel" type="button" hidden>Cancel</button>
          <button id="clear" type="button" hidden>Done</button>
          <button id="retry" type="button" hidden>Download the files again</button>
          <span id="now-note" class="status"></span>
        </div>
      </section>
    </main>
    <script type="module" src="console.js"></script>
  </body>
</html>
